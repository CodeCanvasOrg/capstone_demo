[project]
name = "pdf-worker"
version = "1.0.0"
description = "PDF extraction and structure-aware chunking for source preparation (stdio worker)"
requires-python = ">=3.13,<3.14"
dependencies = ["pymupdf==2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
