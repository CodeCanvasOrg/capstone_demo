openapi: 3.0.3
info:
  title: Canvas generation (CodeCanvas)
  version: 1.0.0
  description: |
    Portfolio page generation for the canvas editor (docs/portfolio-template-plan.md; the academic
    pipeline in docs/canvas-academic-pipeline-plan.md is retired).
    Every route needs CANVAS_EDITOR=pilot and CANVAS_GENERATION=on (404 otherwise), a signed-in
    member of the workspace and, except GET, permission to change the document.
    This is a local test contract refined from `start/routes.ts`, `app/validators/canvas_generation.ts`
    and `tests/functional/portfolio_generation_http.spec.ts`; it is not a published API.
servers:
  - url: http://localhost:3333
security:
  - session: []
paths:
  /workspaces/{workspaceId}/documents:
    post:
      operationId: createCaseStudy
      summary: Create a case study (the New case study form)
      description: |
        With `templateId: brochure` and a `canvas` object, and canvas generation on, the case study is
        created in canvas mode with `canvas` stored as its layout options, and its first generation is
        a canvas run ("Use a template" sends `templateSet: portfolio`, "Let AI choose" sends
        `templateSet: ai_design`). The redirect is to `/documents/{id}/canvas`. With canvas generation
        off, `canvas` is ignored and the `brochure` selection is used as before (redirect to `.../edit`).
        `templateId: null` is a plain text document. Form posts answer 302; a JSON client gets 422 for options
        the portfolio does not offer.
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseStudyRequest' }
      responses:
        '302': { description: Created; Location is the canvas page (canvas path) or the case study page }
        '422': { description: Canvas options the portfolio does not offer, or an invalid brief }
  /workspaces/{workspaceId}/canvas-templates:
    get:
      operationId: listWorkspaceCanvasTemplates
      summary: The page-design thumbnails the New case study form shows (no document needed)
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses:
        '200': { description: 'The templates, each with a previewUrl under /workspaces/:id/canvas-templates/:templateId/preview' }
        '404': { description: CANVAS_EDITOR is not pilot }
  /workspaces/{workspaceId}/documents/{documentId}/canvas/generate:
    post:
      operationId: generateCanvasPages
      summary: Queue the generation of a document's pages
      parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/documentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '202':
          description: Queued. The task runs on the worker; poll the generation resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Queued' }
        '404': { description: Flags off, or no such document in this workspace }
        '409': { description: Stale baseVersionId, a generation already running, or a reused mutationId }
        '422': { description: Options the dialog does not offer }
  /workspaces/{workspaceId}/documents/{documentId}/canvas/generation:
    get:
      operationId: getCanvasGeneration
      summary: The latest run of the document
      parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/documentId' }]
      responses:
        '200':
          description: The latest run, or null before the first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/Run' }]
        '404': { description: Flags off, or no such document }
  /workspaces/{workspaceId}/documents/{documentId}/canvas/pages/{index}/regenerate:
    post:
      operationId: regenerateCanvasPage
      summary: Rewrite, deepen or shorten an entry, or rewrite the cover (a new version; the sources pages are recomposed)
      parameters:
        - { $ref: '#/components/parameters/workspaceId' }
        - { $ref: '#/components/parameters/documentId' }
        - { $ref: '#/components/parameters/index' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutationId, baseVersionId, mode]
              properties:
                mutationId: { type: string, minLength: 8, maxLength: 100 }
                baseVersionId: { type: string, format: uuid, nullable: true }
                mode: { type: string, enum: [rewrite, expand, condense] }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Queued' }
        '404': { description: Flags off, or no such page }
        '409': { description: No generated pages, pages rearranged since, or a sources page, which the application writes, or pages made by a retired template }
        '422': { description: Unknown mode }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: adonis-session }
  parameters:
    workspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    documentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    index: { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
  schemas:
    CreateCaseStudyRequest:
      type: object
      required: [description, sourceMode]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 20000 }
        sourceMode: { type: string, enum: [files, input_only] }
        files: { type: array, items: { type: object, properties: { id: { type: string, format: uuid } } } }
        templateId: { type: string, nullable: true, description: '`brochure` for the layouts below; null for a plain text document' }
        canvas:
          type: object
          description: Stored as the layout's canvas options when canvas generation is on
          properties:
            templateSet: { type: string, enum: [portfolio, ai_design], default: portfolio }
            entries: { oneOf: [{ type: string, enum: [auto] }, { type: integer, minimum: 1, maximum: 6 }], default: auto }
            depth: { type: string, enum: [concise, standard, detailed], default: standard }
            images: { type: boolean, default: true }
        brochure: { type: object, description: 'Used instead of `canvas` when canvas generation is off' }
    Options:
      type: object
      description: |
        The portfolio template is the only template. The retired `templateSet` values
        (academic_report, research_brief, brochure) are still accepted and mean the portfolio;
        anything else is a 422.
      properties:
        depth: { type: string, enum: [concise, standard, detailed], default: standard, description: 'Rows an entry carries: 4 to 5, 6 to 7, 8' }
        entries: { oneOf: [{ type: string, enum: [auto] }, { type: integer, minimum: 1, maximum: 6 }], default: auto }
        templateSet: { type: string, enum: [portfolio, academic_report, research_brief, brochure], default: portfolio }
        profile: { type: string, enum: [academic, informative], default: informative }
        images: { type: boolean, default: true }
    GenerateRequest:
      type: object
      required: [mutationId, baseVersionId]
      properties:
        mutationId: { type: string, minLength: 8, maxLength: 100 }
        baseVersionId: { type: string, format: uuid, nullable: true }
        options: { $ref: '#/components/schemas/Options' }
    Queued:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
    Run:
      type: object
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [queued, planning, retrieving, writing, fitting, images, composing, ready, failed] }
        profile: { type: string }
        depth: { type: string }
        templateSet: { type: string }
        plannerModel: { type: string }
        writerModel: { type: string }
        error: { type: string, nullable: true }
        resultVersionId: { type: string, format: uuid, nullable: true }
        plan: { type: object, nullable: true }
        metrics:
          type: object
          nullable: true
          properties:
            pages: { type: integer }
            words: { type: integer }
            avgFill: { type: number }
            citations: { type: integer }
            placeholders: { type: integer }
            lowDpiImages: { type: integer }
            durationMs: { type: integer }
            tokens: { type: integer }
        pages:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              design: { type: string, enum: [cover, entry, sources] }
              status: { type: string, enum: [pending, written, fitted, failed] }
              purpose: { type: string }
              words: { type: integer, nullable: true }
              fill: { type: number, nullable: true }
              citations: { type: integer }
              attempts: { type: integer }
              notes: { type: array, items: { type: string } }
